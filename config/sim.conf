# Simulator settings (key = value). Load with:  ./bin/vmsim --config config/sim.conf
# Anything given on the command line overrides the value here.

tlb_size        = 8        # TLB entries (LRU). Try 2, 4, 8, 16, 32
frames          = 16       # physical frames managed by the advanced Clock
page_size       = 256      # bytes per page (power of two)
address_bits    = 16       # 16-bit virtual addresses -> 4 outer + 4 inner + 8 offset bits
tlb_flush       = false    # true = flush TLB on every context switch (untagged TLB)

policy          = all      # fcfs, rr, priority, mlfq or all (comma separated)
quantum         = 4        # RR / Priority quantum; MLFQ uses 4 / 8 / 16
aging           = 30       # MLFQ: promote a thread after waiting this many ticks

trace           = input/trace.txt
out             = output
